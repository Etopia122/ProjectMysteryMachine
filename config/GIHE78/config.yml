splits: config/GIHE78/splits.txt
# CodeWarrior for GameCube 1.3.2 (see docs/compiler.md).
mw_comment_version: 10
# Custom linker script: debugger stack is 0x1000 (dtk default 0x2000).
ldscript_template: config/GIHE78/ldscript.tpl
