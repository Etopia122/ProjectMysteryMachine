# Scooby-Doo! Night of 100 Frights (NTSC-U, GIHE78)
#
# The retail DOL (SHA-1 c77fb29d39b5898933e8ef4d1ccd2ddac404554e) has its entry
# point set to a stack-fill routine in .text, which breaks decomp-toolkit's
# .init detection. tools/prepare_dol.py (run by configure.py) extracts it from
# the disc image and writes main_analysis.dol with the entry point set to
# __start. build.sha1 still checks the build against the retail DOL.
name: main
