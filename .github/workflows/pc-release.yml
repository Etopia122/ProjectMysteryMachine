name: PC build

# Releases are published from a locally built archive (python pc/tools/package.py
# then gh release create), so a tag push must not start a second, CI-built
# release. Run this workflow by hand to check that the sources still build and
# that the archive verifies.
on:
  workflow_dispatch:

jobs:
  pc:
    name: Windows PC build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (32-bit toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-python
            mingw-w64-i686-SDL2
            make
            diffutils
            tar
            xz

      - name: Build minimal static FFmpeg
        run: sh pc/tools/build_ffmpeg.sh

      - name: "Build Project: Mystery Machine"
        run: sh pc/tools/build.sh

      - name: Package release (no game assets)
        run: python pc/tools/package.py

      - name: Verify launcher and asset-free archive
        run: python pc/tools/verify_release.py build/dist/ProjectMysteryMachine.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectMysteryMachine
          path: build/dist/ProjectMysteryMachine.zip
          if-no-files-found: error


