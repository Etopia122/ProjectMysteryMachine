name: PC build

# A `v*` tag builds the PC port, verifies the archive and opens a **draft**
# release carrying ProjectMysteryMachine.zip and its .sha256. Nothing is public
# until the draft is reviewed and published by hand. `workflow_dispatch` runs
# the same build and verification without creating a release (a dry run).
#
# The release procedure is in AGENTS.md; the notes come from
# docs/releases/<tag>.md and the "Verifying the download" block is generated by
# pc/tools/release_body.py from the archive CI actually built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc:
    name: Windows PC build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (32-bit toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          # The runner's MSYS2 is recent enough that a full -Syu every release
          # only adds time and flakiness; the package cache keeps re-runs fast.
          update: false
          cache: true
          # SDL2's dependencies that the 32-bit repo still has; SDL2 itself is
          # pinned in a later step. Keep this scalar to package names only:
          # comments inside it are folded into the command as arguments.
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-python
            mingw-w64-i686-cc-libs
            mingw-w64-i686-libiconv
            make
            diffutils
            tar
            xz
            curl
            gnupg

      # MSYS2 dropped mingw-w64-i686-SDL2 in its 32-bit phase-out: the repo no
      # longer has it, but the mirror still serves the last package file, so pin
      # that. Its vulkan dependency is build-time only (SDL2 loads vulkan-1.dll
      # at runtime) and i686 vulkan is gone as well, hence --assume-installed.
      # Bump the version and the hash together, and keep them matching the
      # package the archive is tested against locally.
      - name: Install the pinned i686 SDL2
        run: |
          set -e
          sdl=mingw-w64-i686-SDL2-2.32.10-1-any.pkg.tar.zst
          sha=81b39469a581fd4b1bd1d88785fbb02d5a46c9ef85343a620c8ae2f877ac6c42
          curl -fsSLO "https://mirror.msys2.org/mingw/mingw32/$sdl"
          echo "$sha  $sdl" | sha256sum -c -
          pacman --noconfirm -U --needed --assume-installed mingw-w64-i686-vulkan "$sdl"

      # What a rebuild has to match to reproduce the published hash: a different
      # gcc, binutils or SDL2 produces different code. Recorded on the run page
      # so the versions behind a release are never a matter of memory.
      - name: Record the toolchain
        run: |
          set -e
          {
            echo '### Toolchain'
            echo '```'
            gcc --version | head -1
            ld --version | head -1
            pacman -Q mingw-w64-i686-SDL2 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A release whose tag and launcher version disagree would ship programs
      # that report the wrong version, and notes are checked in per tag; both
      # are cheap to check and expensive to discover after the build.
      - name: Check the tag matches the launcher version
        if: github.ref_type == 'tag'
        run: |
          if [ ! -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::docs/releases/${GITHUB_REF_NAME}.md is missing: land the release notes before pushing the tag"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          version=$(tr -d '\r' < pc/launcher/launcher.rc |
            sed -n 's/^FILEVERSION[[:space:]]*//p' |
            cut -d, -f1-3 | tr ',' '.')
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pc/launcher/launcher.rc FILEVERSION ($version): bump the launcher version or fix the tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches launcher version $version"

      # The minimal static FFmpeg is the slowest step here and only changes when
      # pc/tools/build_ffmpeg.sh changes (its VER pins the release). No
      # restore-keys: a partial restore after a VER bump would leave the old
      # ffmpeg-* tree beside the new one, and package.py takes the first match
      # for its licence texts, so the archive could carry the wrong ones.
      - name: Cache minimal FFmpeg
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('pc/tools/build_ffmpeg.sh') }}

      - name: Build minimal static FFmpeg
        run: sh pc/tools/build_ffmpeg.sh

      - name: "Build Project: Mystery Machine"
        run: sh pc/tools/build.sh

      # CI has no disc data to run the game with, and no GPU: the capture check
      # (pc/tools/captures.py) is a local pre-release step, run by package.py
      # itself on a machine that has the extracted disc. Here only the archive
      # assembly is exercised.
      - name: Package release (no game assets)
        run: python pc/tools/package.py --no-captures

      - name: Verify launcher and asset-free archive
        run: python pc/tools/verify_release.py build/dist/ProjectMysteryMachine.zip

      # The tag path stays short, so this second build runs on demand: it checks
      # the claim the release makes, in the environment that makes the archive.
      - name: Check the archive is reproducible (build twice)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          first=$(cut -d' ' -f1 build/dist/ProjectMysteryMachine.zip.sha256)
          cp build/dist/ProjectMysteryMachine.zip build/dist/repro-first.zip
          export PC_BUILD_DIR=build/pc-repro
          sh pc/tools/build.sh
          python pc/tools/package.py --no-captures
          second=$(cut -d' ' -f1 build/dist/ProjectMysteryMachine.zip.sha256)
          echo "first build:  $first"
          echo "second build: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::two builds of the same commit produced different archives"
            exit 1
          fi
          echo "the archive is reproducible: $second" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the archive and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: ProjectMysteryMachine
          path: |
            build/dist/ProjectMysteryMachine.zip
            build/dist/ProjectMysteryMachine.zip.sha256
          if-no-files-found: error

  release:
    name: Draft release
    needs: pc
    # Only a pushed tag opens a release: a manual run is a dry run, even when it
    # is started on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout (release notes)
        uses: actions/checkout@v4

      - name: Download the archive and its checksum
        uses: actions/download-artifact@v4
        with:
          name: ProjectMysteryMachine

      # The hash only exists once the archive has been built, so it is written
      # here rather than in the notes: docs/releases/<tag>.md holds the prose,
      # release_body.py appends the byte size and SHA-256 of this very artifact.
      - name: Assemble the release body
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::${notes} is missing: every release needs its notes checked in before the tag is pushed"
            exit 1
          fi
          python3 pc/tools/release_body.py "$notes" \
            ProjectMysteryMachine.zip release-body.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --draft --verify-tag \
            --title "Project: Mystery Machine $TAG" \
            --notes-file release-body.md \
            ProjectMysteryMachine.zip \
            ProjectMysteryMachine.zip.sha256
          echo "Draft $TAG is ready: check its notes and assets, then publish it." \
            >> "$GITHUB_STEP_SUMMARY"
